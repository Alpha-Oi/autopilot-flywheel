rules:
  - name: "Block sudo"
    type: "command_contains"
    value: "sudo"
    action: "block"

  - name: "Block Windows System32"
    type: "command_contains"
    value: 'C:\Windows'
    action: "block"

  - name: "Block mkdir for HITL testing"
    type: "command_contains"
    value: "mkdir"
    action: "block"
