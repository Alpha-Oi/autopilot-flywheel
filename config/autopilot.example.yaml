# Autopilot Flywheel — DESIGN PLACEHOLDER
#
# Этот файл НЕ является подтверждённой production-конфигурацией.
# Значения внешних endpoints/commands намеренно не выдуманы.
# Перед включением интеграции её статус должен стать VERIFIED в docs/INTERFACES.md.

schema_version: 0
project_state: "design_foundation"

autopilot:
  core:
    output_dir: "./output"
    interactive: true

  planning:
    enabled: false
    provider: "unverified"
    config: {}

  orchestration:
    enabled: false
    provider: "unverified"
    max_parallel: 1
    config: {}

  coordination:
    enabled: false
    provider: "unverified"
    config: {}

  safety:
    enabled: true
    fail_closed: true
    provider: "unverified"
    # Пока внешний guard не VERIFIED, high-risk actions не должны автоматически разрешаться.
    config: {}

  memory:
    enabled: false
    session_search_provider: "unverified"
    procedural_memory_provider: "unverified"
    config: {}

  deployment:
    enabled: false
    provider: "unverified"
    config: {}
