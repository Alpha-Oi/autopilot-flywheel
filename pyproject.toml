[project]
name = "autopilot-flywheel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alpha-Oi", email = "alpha-oi@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[project.scripts]
autopilot-flywheel = "autopilot_flywheel:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.1",
    "pytest>=9.1.1",
]
