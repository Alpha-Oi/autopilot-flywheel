name: "✨ Feature proposal"
description: "Предложить новую capability или улучшение"
title: "[FEATURE] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Какую конкретную проблему должен решить feature?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Опишите поведение без привязки к конкретному vendor, если это возможно.
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Primary layer
      options:
        - Autopilot Core
        - Planning
        - Orchestration
        - Coordination
        - Safety
        - Memory
        - Verification / Audit
        - Deployment
        - Operator UX
        - Cross-cutting
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks / trade-offs
      description: Safety, complexity, lock-in, compatibility, state management.

  - type: checkboxes
    id: adr
    attributes:
      label: Architecture
      options:
        - label: Это может потребовать ADR.
