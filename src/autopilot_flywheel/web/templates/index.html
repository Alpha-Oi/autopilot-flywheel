<!DOCTYPE html>
<html>
<head>
    <title>Autopilot Flywheel</title>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        h1 { color: #38bdf8; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .column { flex: 1; min-width: 300px; background: #1e293b; padding: 20px; border-radius: 8px; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-plan { background: #3b82f6; }
        .btn-exec { background: #10b981; }
        .btn-coord { background: #f59e0b; }
        .btn-review { background: #8b5cf6; }
        input { padding: 10px; border-radius: 4px; border: 1px solid #475569; background: #1e293b; color: white; flex: 1; }
        .message { padding: 10px; margin-bottom: 10px; background: #334155; border-left: 4px solid #38bdf8; border-radius: 4px; }
        .mermaid { background: #0f172a; padding: 20px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <h1>🚀 Autopilot Flywheel Dashboard</h1>
    
    <div class="controls">
        <form action="/run-plan" method="post" style="display:flex; flex:1; gap:10px;">
            <input type="text" name="command" placeholder="Например: Build API..." required>
            <button type="submit" class="btn-plan">🧠 Plan</button>
        </form>
        <form action="/run-execute" method="post">
            <button type="submit" class="btn-exec">🚀 Execute Worker</button>
        </form>
        <form action="/run-coordinate" method="post">
            <button type="submit" class="btn-coord">👀 Coordinate</button>
        </form>
        <form action="/run-review" method="post">
            <button type="submit" class="btn-review">🔍 Review</button>
        </form>
    </div>

    <div class="container">
        <div class="column" style="flex: 2;">
            <h2>📋 Task Graph (Visual)</h2>
            <div class="mermaid">
{{ mermaid_code }}
            </div>
        </div>
        <div class="column" style="flex: 1;">
            <h2>📬 Agent Inbox</h2>
            {% if not messages %}
                <p>No messages.</p>
            {% endif %}
            {% for msg in messages %}
                <div class="message">
                    <strong>{{ msg.subject }}</strong><br>
                    <small>From: {{ msg.from }}</small>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
